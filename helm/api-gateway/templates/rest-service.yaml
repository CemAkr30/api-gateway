apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.yamls.restService }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: {{ .Values.name }}
  type: ClusterIP

